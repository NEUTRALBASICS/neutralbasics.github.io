  <div class="foot" id="foot">

    <textarea id="cAddr" rows="2" placeholder="Delivery address / city"></textarea>
    <button class="wa" id="checkout">Send order on WhatsApp</button>
    <small>We'll confirm availability, shipping and payment with you on WhatsApp.</small>
  </div>
</aside>

<script src="store.js"></script>
<script>
const C = (new URLSearchParams(location.search).get("c") || "").toLowerCase().startsWith("f") ? "full" : "half";
const meta = CATEGORIES[C];
$("cTitle").textContent = meta.title; $("cSub").textContent = meta.sub;
document.title = meta.title + " · " + meta.sub + " | Neutral Basics";
document.querySelectorAll(".pills a").forEach(a => a.classList.toggle("on", a.dataset.c === C));
loadProducts(list => {
  if (!list){ $("status").textContent = "Couldn't load products right now. Please refresh, or message us on WhatsApp."; return; }
  $("status").textContent = "";
  products = list.filter(p => p.cat === C).map((p, i) => ({...p, id:i}));
  render();
  if (!products.length) $("grid").innerHTML = '<div class="soon"><h3>Coming soon</h3><p>New ' + meta.sub.toLowerCase() + ' styles are on the way.</p><a href="https://wa.me/' + CONFIG.WHATSAPP + '?text=' + encodeURIComponent("Hi Neutral Basics! Please let me know when the " + meta.sub.toLowerCase() + " styles are available.") + '" target="_blank" rel="noopener">Ask on WhatsApp</a></div>';
});
</script>
